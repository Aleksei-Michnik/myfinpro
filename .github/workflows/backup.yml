# .github/workflows/backup.yml
# Scheduled database backups — the replacement for the cron job that docs/backup.md
# used to describe and that was never installed on the server.
#
# Every run, per environment: copy the backup scripts to the server, dump the database
# inside its MySQL container with the container's own credentials, gzip-test the file,
# apply retention (7 daily + 4 weekly), verify the newest file, and fail the run when
# the newest backup is older than 26 hours. On Sundays (or with the `drill` input) the
# newest backup is also restored into a throwaway <db>_verify schema, counted and dropped.
#
# The workflow needs only the SSH host/user/key secrets: no database credential leaves
# the container. A failed scheduled run is the alert — GitHub notifies the repo owner.
#
# Off-box copy (production only): when the BACKUP_AGE_RECIPIENT variable and the
# BACKUP_STORE_SSH_KEY secret exist, the newest production backup is fetched to the
# runner, encrypted to the recipient with age, and published into the private
# <repository>-backups store as a single snapshot commit (scripts/backup-copy.sh).
# Without them the step reports "not configured" and the run stays green.

name: Backup

on:
  schedule:
    # Daily at 02:17 UTC — a quiet hour for both environments.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Also run the restore drill now (otherwise it runs on Sundays)'
        required: false
        type: boolean
        default: false

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - environment: production
            secret_prefix: PRODUCTION
          - environment: staging
            secret_prefix: STAGING

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy backup scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.secret_prefix)] }}
          username: ${{ secrets[format('{0}_USER', matrix.secret_prefix)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.secret_prefix)] }}
          source: >-
            scripts/backup-common.sh,
            scripts/backup.sh,
            scripts/verify-backup.sh,
            scripts/check-backup-age.sh,
            scripts/restore.sh
          target: /opt/myfinpro/backups
          overwrite: true

      - name: Back up, verify, check age
        uses: appleboy/ssh-action@v1.2.2
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DRILL: ${{ inputs.drill }}
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.secret_prefix)] }}
          username: ${{ secrets[format('{0}_USER', matrix.secret_prefix)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.secret_prefix)] }}
          command_timeout: 15m
          envs: ENVIRONMENT,DRILL
          script: |
            set -euo pipefail
            cd /opt/myfinpro/backups/scripts
            chmod +x ./*.sh

            echo "── Backup ($ENVIRONMENT) ──"
            ./backup.sh "$ENVIRONMENT"

            if [ "${DRILL:-false}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
              echo "── Verify + restore drill ──"
              ./verify-backup.sh "$ENVIRONMENT" --test-restore
            else
              echo "── Verify ──"
              ./verify-backup.sh "$ENVIRONMENT"
            fi

            echo "── Age check (fails the run when the newest backup is older than 26 h) ──"
            ./check-backup-age.sh "$ENVIRONMENT" --max-age 26

            echo "── Backups on disk ──"
            ls -lh "/opt/myfinpro/backups/$ENVIRONMENT"
            df -h /opt | tail -1

      - name: Off-box copy of the newest production backup
        if: matrix.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          STORE_SSH_KEY: ${{ secrets.BACKUP_STORE_SSH_KEY }}
          STORE_URL: git@github.com:${{ github.repository }}-backups.git
          SERVER_HOST: ${{ secrets.PRODUCTION_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_USER }}
          SERVER_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -z "$AGE_RECIPIENT" ] || [ -z "$STORE_SSH_KEY" ]; then
            echo "::notice::Off-box copy not configured (BACKUP_AGE_RECIPIENT variable, BACKUP_STORE_SSH_KEY secret): skipped."
            exit 0
          fi
          echo "── Installing age ──"
          gh release download -R FiloSottile/age v1.3.2 -p 'age-v1.3.2-linux-amd64.tar.gz' -O "$RUNNER_TEMP/age.tgz"
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
          echo "── Keys for this run only (ephemeral runner) ──"
          umask 077
          mkdir -p "$RUNNER_TEMP/keys" ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/keys/server"
          printf '%s\n' "$STORE_SSH_KEY" > "$RUNNER_TEMP/keys/store"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' >> ~/.ssh/known_hosts
          echo "── Copy ──"
          SERVER_SSH_KEY_FILE="$RUNNER_TEMP/keys/server" STORE_SSH_KEY_FILE="$RUNNER_TEMP/keys/store" \
            bash scripts/backup-copy.sh production
